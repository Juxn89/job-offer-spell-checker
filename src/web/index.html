<!doctype html>
<!-- Purpose: the checker page (`@revisor/web`), REQ-001, REQ-002, REQ-019 and REQ-033: the text box with
     its highlight layer, Check spelling, the count line, Copy text, the messages, the notice under the box
     and the footer's privacy link. The build fills %STYLE% and %SCRIPT% with the content-hashed asset
     names. Element identifiers follow D-021, D-028 and D-033. -->
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Revisa la ortografía de una oferta de empleo en español.">
    <title>Revisor ortográfico de ofertas</title>
    <link rel="stylesheet" href="/assets/%STYLE%">
  </head>
  <body>
    <main data-element="checker">
      <h1>Revisor ortográfico de ofertas</h1>
      <p class="intro">Pega el texto de tu oferta de empleo y pulsa <strong>Revisar ortografía</strong>. Las palabras con faltas se marcan en el texto: haz clic en una para ver sugerencias.</p>
      <label for="offer">Texto de la oferta</label>
      <p class="count" data-element="count" role="status" aria-live="polite"></p>
      <div class="editor">
        <textarea id="offer" data-element="offer" lang="es" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="sentences" placeholder="Pega aquí el texto de la oferta…"></textarea>
        <div class="marks" id="marks"></div>
      </div>
      <p class="notice" data-element="notice">El texto se revisa en nuestro servidor y no se guarda.</p>
      <div class="actions">
        <button type="button" class="primary" data-element="check">Revisar ortografía</button>
        <button type="button" data-element="copy">Copiar texto</button>
      </div>
      <p class="message" data-element="message" role="status" aria-live="polite"></p>
    </main>
    <footer data-element="footer">
      <a data-element="privacy-link" href="/privacidad">Aviso de privacidad</a>
    </footer>
    <script src="/assets/%SCRIPT%"></script>
  </body>
</html>
